<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pearl gradient -->
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    
    <!-- Gold gradient -->
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#f8e27f" />
      <stop offset="50%" stop-color="#f1c12a" />
      <stop offset="100%" stop-color="#e0a81e" />
    </radialGradient>
    
    <!-- Silver gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="50%" stop-color="#c0c0c0" />
      <stop offset="100%" stop-color="#a9a9a9" />
    </linearGradient>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f4f0" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </linearGradient>
    
    <!-- Pattern for background -->
    <pattern id="patternDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#d4c5b5" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#patternDots)" opacity="0.3" />
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="560" fill="none" stroke="#8c7561" stroke-width="2" rx="10" ry="10" />
  <rect x="30" y="30" width="1140" height="540" fill="none" stroke="#8c7561" stroke-width="1" rx="5" ry="5" />
  
  <!-- Main title -->
  <text x="50%" y="120" font-family="serif" font-size="60" fill="#8c7561" text-anchor="middle" font-weight="bold">Bejewelled Stories</text>
  <text x="50%" y="180" font-family="serif" font-size="30" fill="#8c7561" text-anchor="middle" font-style="italic">Timeless Elegance, Modern Design</text>
  
  <!-- Decorative jewelry elements -->
  
  <!-- Central necklace -->
  <path d="M400,300 Q600,220 800,300" stroke="#e0a81e" stroke-width="3" fill="none" />
  <circle cx="400" cy="300" r="15" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="450" cy="285" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="500" cy="270" r="15" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="550" cy="255" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="600" cy="250" r="25" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="650" cy="255" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="700" cy="270" r="15" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="750" cy="285" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="800" cy="300" r="15" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  
  <!-- Left earring -->
  <g transform="translate(250, 350)">
    <path d="M0,0 C10,-10 20,-50 0,-80" stroke="url(#silverGradient)" stroke-width="3" fill="none" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    <circle cx="0" cy="30" r="15" fill="url(#pearlGradient)" stroke="url(#silverGradient)" stroke-width="1" />
  </g>
  
  <!-- Right earring -->
  <g transform="translate(950, 350)">
    <path d="M0,0 C10,-10 20,-50 0,-80" stroke="url(#silverGradient)" stroke-width="3" fill="none" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    <circle cx="0" cy="30" r="15" fill="url(#pearlGradient)" stroke="url(#silverGradient)" stroke-width="1" />
  </g>
  
  <!-- Bracelet -->
  <ellipse cx="600" cy="450" rx="150" ry="50" fill="none" stroke="#e0a81e" stroke-width="2" stroke-dasharray="5,5" />
  <circle cx="450" cy="450" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="480" cy="440" r="12" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="510" cy="430" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="540" cy="425" r="12" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="570" cy="420" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="600" cy="420" r="12" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="630" cy="420" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="660" cy="425" r="12" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="690" cy="430" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="720" cy="440" r="12" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="750" cy="450" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  
  <!-- Tagline at bottom -->
  <text x="50%" y="540" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 