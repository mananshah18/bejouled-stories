  <circle cx="190" cy="348" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="230" cy="346" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="270" cy="344" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="310" cy="342" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="350" cy="341" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="400" cy="340" r="18" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="450" cy="341" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="490" cy="342" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="530" cy="344" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="570" cy="346" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="610" cy="348" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="650" cy="350" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  
  <!-- Gold connector elements -->
  <circle cx="400" cy="240" r="5" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
  <path d="M400,240 L400,270" stroke="#e0a81e" stroke-width="1" fill="none" />
  
  <circle cx="400" cy="310" r="5" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
  <path d="M400,310 L400,340" stroke="#e0a81e" stroke-width="1" fill="none" />
  
  <!-- Clasps -->
  <rect x="140" y="350" width="10" height="5" fill="url(#goldGradient)" rx="2" ry="2" />
  <rect x="650" y="350" width="10" height="5" fill="url(#goldGradient)" rx="2" ry="2" />
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 