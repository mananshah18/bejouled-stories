<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#f8e27f" />
      <stop offset="50%" stop-color="#f1c12a" />
      <stop offset="100%" stop-color="#e0a81e" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Sita Layered Pearl Necklace</text>
  
  <!-- First layer (top) -->
  <path d="M250,250 Q400,200 550,250" stroke="#e0a81e" stroke-width="2" fill="none" />
  
  <!-- Pearls on first layer -->
  <circle cx="250" cy="250" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="290" cy="235" r="8" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="330" cy="220" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="370" cy="210" r="8" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="400" cy="200" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="430" cy="210" r="8" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="470" cy="220" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
