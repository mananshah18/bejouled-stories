  <circle cx="200" cy="300" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="240" cy="290" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="280" cy="280" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="320" cy="275" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="360" cy="270" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="400" cy="270" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="440" cy="270" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="480" cy="275" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="520" cy="280" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="560" cy="290" r="10" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="600" cy="300" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  
