<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Amara Pearl Necklace</text>
  
  <!-- Gold chain -->
  <path d="M200,300 Q400,200 600,300" stroke="#e0a81e" stroke-width="3" fill="none" />
  
  <!-- Pearls -->
  <circle cx="200" cy="300" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="250" cy="280" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="300" cy="260" r="18" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="350" cy="240" r="14" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="400" cy="230" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="450" cy="240" r="16" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="500" cy="260" r="19" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="550" cy="280" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  <circle cx="600" cy="300" r="20" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
