<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="50%" stop-color="#c0c0c0" />
      <stop offset="100%" stop-color="#a9a9a9" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Anika Pearl Pendant</text>
  
  <!-- Silver chain -->
  <path d="M400,150 L400,200" stroke="url(#silverGradient)" stroke-width="2" fill="none" />
  
  <!-- Pendant setting -->
  <g transform="translate(400, 300)">
    <!-- Silver filigree work -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#silverGradient)" stroke-width="3" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    
    <!-- Filigree pattern -->
    <path d="M-40,0 C-30,30 30,30 40,0" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    <path d="M-40,0 C-30,-30 30,-30 40,0" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    <path d="M0,-40 C-30,-30 -30,30 0,40" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    <path d="M0,-40 C30,-30 30,30 0,40" fill="none" stroke="url(#silverGradient)" stroke-width="2" />
    
    <!-- Small decorative elements -->
    <circle cx="-30" cy="-30" r="5" fill="url(#silverGradient)" />
    <circle cx="30" cy="-30" r="5" fill="url(#silverGradient)" />
    <circle cx="-30" cy="30" r="5" fill="url(#silverGradient)" />
    <circle cx="30" cy="30" r="5" fill="url(#silverGradient)" />
    
    <!-- Main pearl -->
    <circle cx="0" cy="0" r="30" fill="url(#pearlGradient)" stroke="url(#silverGradient)" stroke-width="1" />
    
    <!-- Highlight on pearl -->
    <circle cx="-10" cy="-10" r="10" fill="white" opacity="0.3" />
  </g>
  
  <!-- Chain links -->
  <g transform="translate(400, 175)">
    <path d="M0,0 C-5,-5 -5,5 0,10 C5,5 5,-5 0,0" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,10 C-5,5 -5,15 0,20 C5,15 5,5 0,10" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,20 C-5,15 -5,25 0,30 C5,25 5,15 0,20" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,30 C-5,25 -5,35 0,40 C5,35 5,25 0,30" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,40 C-5,35 -5,45 0,50 C5,45 5,35 0,40" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,50 C-5,45 -5,55 0,60 C5,55 5,45 0,50" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
    <path d="M0,60 C-5,55 -5,65 0,70 C5,65 5,55 0,60" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" />
  </g>
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 