<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#f8e27f" />
      <stop offset="50%" stop-color="#f1c12a" />
      <stop offset="100%" stop-color="#e0a81e" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Priya Pearl Ring</text>
  
  <!-- Ring band -->
  <ellipse cx="400" cy="300" rx="100" ry="40" fill="none" stroke="url(#goldGradient)" stroke-width="15" />
  
  <!-- Ring setting -->
  <g transform="translate(400, 260)">
    <!-- Gold prongs -->
    <path d="M-20,0 L-15,-15 L-5,-20 L5,-20 L15,-15 L20,0" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
    <path d="M-20,0 C-20,10 -10,20 0,20 C10,20 20,10 20,0" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
    
    <!-- Small decorative pearls -->
    <circle cx="-15" cy="-5" r="5" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="0.5" />
    <circle cx="15" cy="-5" r="5" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="0.5" />
    
    <!-- Main pearl -->
    <circle cx="0" cy="-25" r="25" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    
    <!-- Highlight on pearl -->
    <circle cx="-8" cy="-33" r="8" fill="white" opacity="0.3" />
  </g>
  
  <!-- Ring shadow -->
  <ellipse cx="400" cy="340" rx="100" ry="10" fill="#d4c5b5" opacity="0.3" />
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 