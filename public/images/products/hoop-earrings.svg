<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#f8e27f" />
      <stop offset="50%" stop-color="#f1c12a" />
      <stop offset="100%" stop-color="#e0a81e" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Maya Pearl Hoop Earrings</text>
  
  <!-- Left Earring -->
  <g transform="translate(300, 300)">
    <!-- Gold hoop -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldGradient)" stroke-width="6" />
    
    <!-- Earring clasp -->
    <path d="M0,-80 C-10,-90 -10,-100 0,-100" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <path d="M0,-80 C10,-90 10,-100 0,-100" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    
    <!-- Suspended pearls -->
    <circle cx="-60" cy="-53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-80" cy="0" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-60" cy="53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="0" cy="80" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="60" cy="53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="80" cy="0" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="60" cy="-53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    
    <!-- Pearl connections -->
    <path d="M-60,-53 L-56,-50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M-80,0 L-74,0" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M-60,53 L-56,50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M0,80 L0,74" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M60,53 L56,50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M80,0 L74,0" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M60,-53 L56,-50" stroke="#e0a81e" stroke-width="1" fill="none" />
  </g>
  
  <!-- Right Earring -->
  <g transform="translate(500, 300)">
    <!-- Gold hoop -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldGradient)" stroke-width="6" />
    
    <!-- Earring clasp -->
    <path d="M0,-80 C-10,-90 -10,-100 0,-100" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <path d="M0,-80 C10,-90 10,-100 0,-100" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    
    <!-- Suspended pearls -->
    <circle cx="-60" cy="-53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-80" cy="0" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-60" cy="53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="0" cy="80" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="60" cy="53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="80" cy="0" r="15" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="60" cy="-53" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
    
    <!-- Pearl connections -->
    <path d="M-60,-53 L-56,-50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M-80,0 L-74,0" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M-60,53 L-56,50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M0,80 L0,74" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M60,53 L56,50" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M80,0 L74,0" stroke="#e0a81e" stroke-width="1" fill="none" />
    <path d="M60,-53 L56,-50" stroke="#e0a81e" stroke-width="1" fill="none" />
  </g>
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 