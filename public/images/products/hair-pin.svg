<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f9f6f3" />
      <stop offset="100%" stop-color="#e9dfd3" />
    </radialGradient>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#f8e27f" />
      <stop offset="50%" stop-color="#f1c12a" />
      <stop offset="100%" stop-color="#e0a81e" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5efe9" />
  <text x="50%" y="100" font-family="serif" font-size="40" fill="#8c7561" text-anchor="middle">Indira Pearl Hair Pin</text>
  
  <!-- Hair pin -->
  <g transform="translate(400, 300) rotate(45)">
    <!-- Pin base -->
    <path d="M-150,0 L150,0" stroke="#e0a81e" stroke-width="3" fill="none" />
    
    <!-- Gold decorative elements -->
    <circle cx="-120" cy="0" r="8" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-80" cy="0" r="8" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
    <circle cx="-40" cy="0" r="8" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
    
    <!-- Pearl cluster -->
    <g transform="translate(60, 0)">
      <!-- Central large pearl -->
      <circle cx="0" cy="0" r="25" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      
      <!-- Surrounding smaller pearls -->
      <circle cx="-20" cy="-15" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="0" cy="-22" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="20" cy="-15" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="25" cy="0" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="20" cy="15" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="0" cy="22" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="-20" cy="15" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      <circle cx="-25" cy="0" r="12" fill="url(#pearlGradient)" stroke="#e0a81e" stroke-width="1" />
      
      <!-- Gold accents between pearls -->
      <circle cx="-10" cy="-18" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="10" cy="-18" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="22" cy="-8" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="22" cy="8" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="10" cy="18" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="-10" cy="18" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="-22" cy="8" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
      <circle cx="-22" cy="-8" r="4" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="0.5" />
    </g>
    
    <!-- Pin end -->
    <circle cx="150" cy="0" r="3" fill="url(#goldGradient)" stroke="#e0a81e" stroke-width="1" />
  </g>
  
  <!-- Shadow -->
  <ellipse cx="400" cy="380" rx="120" ry="20" fill="#d4c5b5" opacity="0.3" />
  
  <text x="50%" y="500" font-family="sans-serif" font-size="24" fill="#8c7561" text-anchor="middle">Bejewelled Stories</text>
  <text x="50%" y="540" font-family="sans-serif" font-size="18" fill="#8c7561" text-anchor="middle">Traditional Indian Jewelry with a Modern Touch</text>
</svg> 